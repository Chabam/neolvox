name: ci-standalone
on:
  workflow_call:
    inputs:
      do_release:
        required: false
        type: boolean
        default: false
      do_testing:
        required: false
        type: boolean
        default: false

jobs:
  job:
    name: ${{ matrix.os }}-${{ github.workflow }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: windows-latest
            triplet: x64-windows-release
            configurePreset: 'windows-standalone'
          - os: ubuntu-latest
            configurePreset: 'linux-standalone'
    steps:
      - uses: actions/checkout@v4

      - name: Install Conan
        uses: conan-io/setup-conan@v1
        with:
          cache_packages: true


      - name: Install Conan dependencies
        run: |
          conan install . --build=missing --output-folder=build -s compiler.cppstd=20
          conan cache clean


      - uses: lukka/get-cmake@latest

      - name: Configure project
        run: cmake --preset standalone-conan-dev

      - name: Build
        run: cmake --build build
